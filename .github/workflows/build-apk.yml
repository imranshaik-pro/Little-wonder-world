name: Build Little Wonder World test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'releases/**'
      - 'build-apk.sh'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Check source exists
        run: test -f build-apk.sh && test -f app/src/main/java/com/littlewonderworld/app/MainActivity.java && test -f releases/v2.0.0.js
      - name: Build test APK
        env:
          LWW_ANDROID_SDK: ${{ env.ANDROID_HOME }}
        run: bash build-apk.sh v2.0.0
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LittleWonderWorld-v2.0.0-V4-test
          path: LittleWonderWorld-v2.0.0.apk
          if-no-files-found: error
